<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPE Studio · Site-uri pe care le vezi înainte să plătești</title>
<meta name="description" content="Studio web din Târgu Mureș. Construim site-ul afacerii tale înainte să plătești: îl vezi pe telefon, apoi decizi.">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<script>
document.documentElement.classList.add('js');
/* Varianta simplă DOAR pentru calculatoarele fără placă video (randare software).
   Nu ghicim după viteză: un PC bun e lent 1-2 secunde la încărcare și asta nu înseamnă că e slab.
   ?lite / ?full forțează modul și se ține minte. */
(function(){var d=document.documentElement,L=false,q=location.search,m=null;
try{localStorage.removeItem('bpe-mode');m=localStorage.getItem('bpe-pick')}catch(e){}
function sv(v){try{localStorage.setItem('bpe-pick',v)}catch(e){}}
if(/[?&]lite\b/.test(q)){L=true;sv('lite')}else if(/[?&]full\b/.test(q)){sv('full')}
else if(m==='lite')L=true;
else if(m!=='full'){try{var c=document.createElement('canvas'),g=c.getContext('webgl')||c.getContext('experimental-webgl');
  if(!g)L=true;else{var x=g.getExtension('WEBGL_debug_renderer_info'),r=x?String(g.getParameter(x.UNMASKED_RENDERER_WEBGL)):'';
  if(/swiftshader|llvmpipe|softpipe|software|basic render/i.test(r))L=true;var lc=g.getExtension('WEBGL_lose_context');if(lc)lc.loseContext()}}catch(e){L=true}}
window.LITE=L;if(L)d.classList.add('lite')})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
